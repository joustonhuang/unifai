name: Bootstrap Installer Preflight

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
      - 'claude/**'

permissions:
  contents: read

concurrency:
  group: bootstrap-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-preflight:
    name: Bootstrap Installer Preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Task
        run: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Run bootstrap Task entrypoint
        run: task verify

      - name: Upload bootstrap preflight report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bootstrap-preflight-report
          path: ci-artifacts/bootstrap-preflight/
          retention-days: 30
